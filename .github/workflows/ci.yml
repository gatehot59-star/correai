# CI de KAMPE IR. Instrumento ajeno: runner limpio de GitHub, baja el repo de
# cero. Jobs separados a proposito, para que un rojo diga QUE es rojo.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go-gateway:
    name: hipersec (go build + vet + test -race -short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go version
      - run: go build ./...
      # vet incluye copylocks: desde el fix de D-26 los filtros tienen un
      # sync.Mutex, y copiar uno por valor duplica el estado de sincronizacion
      # en silencio. Este es el guard que lo impide.
      - run: go vet ./...
      # `-short` NO es cosmetico: es lo que hace que este portón mida
      # correctitud. Sin el, `go test -race ./...` corre los cuatro tests que
      # dependen del TIEMPO DE PARED (latencia_test.go:268 y :395,
      # candado_bench_test.go:312 y :369) bajo el detector de carreras, que en
      # este mismo repo se midio 16,9x mas lento
      # (verificacion/resultados-actions/bench-candado-vs-race.txt). Un cuantil
      # medido bajo -race no mide el candado: mide el detector. Es la misma
      # separacion que ya usan go-bench-candado.yml y go-latencia-p99.yml,
      # donde a `go test -short -race` se le llama "la suite de correctitud".
      - run: go test -race -short ./...

  go-tiempo-de-pared:
    name: hipersec tiempo de pared (bench y cuantiles, SIN -race, a pedido)
    runs-on: ubuntu-latest
    # Solo por `workflow_dispatch`. Estos tests miden tiempo de pared en un
    # runner compartido, asi que su resultado depende del vecino de VM: no
    # sirven como portón por PR, y volverlos obligatorios seria convertir
    # ruido de infraestructura en rojos de codigo. Se dejan corribles a pedido
    # en vez de borrarlos, que es lo que los haria invisibles.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go version
      # Los cuatro que `-short` saltea, corridos explicitamente y sin -race.
      # -count=1 desactiva el cache de tests: una medicion cacheada no es una
      # medicion.
      - run: |
          go test -run 'TestControlDeContencion|TestCostoDelCandado|TestLatenciaP99DeLaEspera|TestControlPositivoDeCola' \
                  -v -count=1 -cpu=4 -timeout 20m ./gateway/...

  cpp-dualbrain:
    name: dualbrain (verificador con invariantes y defectos medidos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ --version
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -o t_engine verificacion/t_engine.cpp
      - run: ./t_engine

  c-antireplay:
    name: hipersec anti-replay (aritmetica de validateTimestamp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -O0 -Wall -Wextra -Werror -o t_ts verificacion/t_ts.c
      - run: ./t_ts

  python-syntax:
    name: audit + fleet (compileall, solo sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q audit fleet

  custos-legis:
    name: custos legis (HMAC vs stdlib + colision de canonicalizacion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verificacion/t_custos.py
      - run: python verificacion/t_fleet.py

  testis:
    name: testis (cadena de hash + Sello, 10 controles positivos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `cryptography` solo habilita el control positivo de ed25519 (D-25).
      # Sin ella el verificador corre igual y lo declara NO MEDIDO.
      - run: pip install --quiet cryptography
      - run: python verificacion/t_testis.py
