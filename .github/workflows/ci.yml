# CI de KAMPE IR. Instrumento ajeno: runner limpio de GitHub, baja el repo de
# cero. Jobs separados a proposito, para que un rojo diga QUE es rojo.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go-gateway:
    name: hipersec (go build + vet + test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  cpp-dualbrain:
    name: dualbrain (verificador con invariantes y defectos medidos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ --version
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -o t_engine verificacion/t_engine.cpp
      - run: ./t_engine

  c-antireplay:
    name: hipersec anti-replay (aritmetica de validateTimestamp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -O0 -Wall -Wextra -Werror -o t_ts verificacion/t_ts.c
      - run: ./t_ts

  python-syntax:
    name: audit + fleet (compileall, solo sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q audit fleet

  custos-legis:
    name: custos legis (HMAC vs stdlib + colision de canonicalizacion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verificacion/t_custos.py
      - run: python verificacion/t_fleet.py

  testis:
    name: testis (cadena de hash + Sello, 10 controles positivos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `cryptography` solo habilita el control positivo de ed25519 (D-25).
      # Sin ella el verificador corre igual y lo declara NO MEDIDO.
      - run: pip install --quiet cryptography
      - run: python verificacion/t_testis.py
