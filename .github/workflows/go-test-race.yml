# Corre el primer test Go del repo con el detector de carreras, y agrega el
# control que hace que el verde valga: la MISMA suite corrida SIN -race tiene
# que dar ROJO. Si pasara en los dos casos, el detector seria decorativo.
#
# Cada seccion escribe SU PROPIO archivo, y cada guard mira solo el suyo. En la
# primera version un unico archivo mezclaba la corrida con -race y la corrida
# sin -race, asi que el chequeo "ningun test en FAIL" leia el FAIL deliberado
# del control y daba rojo falso.
#
# Commitea su propio resultado: ningun agente puede leer el texto de un log de
# Actions, asi que un resultado no commiteado es invisible.
name: go-test-race

on:
  workflow_dispatch:
  push:
    branches:
      - titan/test-go-race
    paths:
      - 'gateway/**'
      - 'go.mod'
      - '.github/workflows/go-test-race.yml'

permissions:
  contents: write

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Formato, build y vet
        if: always()
        run: |
          set +e
          mkdir -p verificacion/resultados-actions
          BASE=verificacion/resultados-actions/go-test-race.txt
          {
            echo "Maquina: Actions ubuntu-latest (VM limpia, instrumento ajeno)"
            echo "Commit:  ${GITHUB_SHA}"
            echo "Fecha:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner:  $(uname -srm)"
            go version
            grep '^module' go.mod
            echo
            echo "=== PASO 0: gofmt ==="
            echo "--- archivos sin formatear antes ---"
            gofmt -l gateway/
            echo "--- diff que aplica gofmt a race_test.go ---"
            gofmt -d gateway/race_test.go
            gofmt -w gateway/race_test.go
            echo "--- archivos sin formatear despues (solo los preexistentes) ---"
            gofmt -l gateway/
            echo "sha256 del test ya formateado: $(sha256sum gateway/race_test.go | cut -d' ' -f1)"
            echo
            echo "=== PASO 1: go build ./... ==="
            go build ./... 2>&1
            echo "EXIT_build=$?"
            echo
            echo "=== PASO 2: go vet ./... ==="
            go vet ./... 2>&1
            echo "EXIT_vet=$?"
          } > "$BASE" 2>&1
          cat "$BASE"

      - name: Correr la suite CON el detector
        if: always()
        run: |
          set +e
          CONRACE=verificacion/resultados-actions/go-test-conrace.txt
          {
            echo "=== go test -race -v -count=1 ./gateway/... ==="
            echo "Los bloques del detector aparecen dentro del log de cada test,"
            echo "porque el test loguea SIEMPRE la salida cruda del subproceso."
            echo
            go test -race -v -count=1 ./gateway/... 2>&1
            echo "EXIT_test_race=$?"
          } > "$CONRACE" 2>&1
          tail -40 "$CONRACE"

      - name: Control por mutacion del FLAG, la misma suite SIN detector
        if: always()
        run: |
          set +e
          SINRACE=verificacion/resultados-actions/go-test-sinrace.txt
          {
            echo "=== go test -v -count=1 -run TestControlPositivo_DetectorArmado ./gateway/... ==="
            echo "SIN -race. Tiene que dar ROJO: si pasara, el detector no seria"
            echo "lo que produce el verde de la corrida anterior."
            echo
            go test -v -count=1 -run 'TestControlPositivo_DetectorArmado' ./gateway/... 2>&1
            echo "EXIT_test_sin_race=$?"
          } > "$SINRACE" 2>&1
          cat "$SINRACE"

      - name: Veredicto
        if: always()
        run: |
          set +e
          BASE=verificacion/resultados-actions/go-test-race.txt
          CONRACE=verificacion/resultados-actions/go-test-conrace.txt
          SINRACE=verificacion/resultados-actions/go-test-sinrace.txt
          FALLAS=0

          esperar() {
            # $1 descripcion, $2 archivo, $3 patron, $4 SI|NO
            if grep -q -- "$3" "$2"; then HAY=SI; else HAY=NO; fi
            if [ "$HAY" = "$4" ]; then
              printf 'PASS  %-58s [%s] aparece=%s esperado=%s\n' "$1" "$(basename $2)" "$HAY" "$4"
            else
              printf 'FAIL  %-58s [%s] aparece=%s esperado=%s\n' "$1" "$(basename $2)" "$HAY" "$4"
              FALLAS=$((FALLAS+1))
            fi
          }

          {
            echo
            echo "=== VEREDICTO ==="
            esperar 'compila'                                  "$BASE"    'EXIT_build=0'                                        SI
            esperar 'go vet limpio'                            "$BASE"    'EXIT_vet=0'                                          SI
            esperar 'el detector estaba armado'                "$CONRACE" '--- PASS: TestControlPositivo_DetectorArmado'          SI
            esperar 'D-26 reproduce con -race'                 "$CONRACE" '--- PASS: TestD26_LosFiltrosCorrenSinSincronizacion'   SI
            esperar 'el FSM sincronizado no reporta carrera'   "$CONRACE" '--- PASS: TestControlNegativo_ElFSMNoReportaCarrera'  SI
            esperar 'D-47 medido sobre la funcion real'        "$CONRACE" '--- PASS: TestD47_ElHMACNoCubreContextNiCiphertext'   SI
            esperar 'validateTimestamp pasa'                   "$CONRACE" '--- PASS: TestValidateTimestamp'                      SI
            esperar 'el detector emitio su marca completa'     "$CONRACE" 'WARNING: DATA RACE'                                   SI
            esperar 'el reporte cita filters.go'               "$CONRACE" 'filters.go'                                           SI
            esperar 'la suite con -race termino en 0'          "$CONRACE" 'EXIT_test_race=0'                                     SI
            esperar 'ningun test en FAIL en la corrida -race'  "$CONRACE" '^--- FAIL'                                            NO
            esperar 'SIN -race el control positivo cae'        "$SINRACE" 'EXIT_test_sin_race=1'                                 SI
            esperar 'SIN -race el FAIL es el del detector'     "$SINRACE" '^--- FAIL: TestControlPositivo_DetectorArmado'         SI
            echo
            echo "FALLAS_DE_VEREDICTO=$FALLAS"
            if [ "$FALLAS" -eq 0 ]; then echo "RESULTADO=VERDE"; else echo "RESULTADO=ROJO"; fi
            echo
            echo "reportes_del_detector_conrace=$(grep -c 'WARNING: DATA RACE' "$CONRACE")"
            echo "reportes_del_detector_sinrace=$(grep -c 'WARNING: DATA RACE' "$SINRACE")"
            echo "tests_PASS_conrace=$(grep -c '^--- PASS' "$CONRACE")"
            echo "tests_FAIL_conrace=$(grep -c '^--- FAIL' "$CONRACE")"
            echo
            echo "Los tres archivos de esta medicion:"
            echo "  go-test-race.txt     formato, build y vet"
            echo "  go-test-conrace.txt  la suite con -race, con los reportes crudos"
            echo "  go-test-sinrace.txt  el control por mutacion del flag"
          } >> "$BASE"
          tail -30 "$BASE"

      - name: Commitear los resultados y el archivo formateado
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin titan/test-go-race || true
          git add verificacion/resultados-actions/go-test-race.txt \
                  verificacion/resultados-actions/go-test-conrace.txt \
                  verificacion/resultados-actions/go-test-sinrace.txt \
                  gateway/race_test.go
          git commit -m 'evidencia: go test -race, control por mutacion del flag y gofmt aplicado [skip ci]' || echo 'sin cambios'
          git push origin HEAD:titan/test-go-race

      - name: Fallar si el veredicto no es verde
        if: always()
        run: |
          grep -q 'RESULTADO=VERDE' verificacion/resultados-actions/go-test-race.txt || {
            echo 'El veredicto no es verde.'
            grep -E '^(PASS|FAIL) |FALLAS_DE_VEREDICTO=|RESULTADO=' verificacion/resultados-actions/go-test-race.txt
            exit 1
          }
          grep -E 'FALLAS_DE_VEREDICTO=|RESULTADO=|reportes_del_detector|tests_' verificacion/resultados-actions/go-test-race.txt
