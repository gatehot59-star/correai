# MQTT ACL - Zero-Trust por identidad de usuario.
#
# MEDIDO 2026-09-07, mosquitto 2.0.18 en VM limpia de Actions:
# mosquitto NO sustituye %u en las lineas 'user'. La version anterior de este
# archivo usaba 'user %u', lo que creaba un usuario llamado LITERALMENTE '%u'
# y dejaba al resto de la flota sin ninguna regla aplicable. Y el ACL de
# mosquitto es una allowlist pura: sin regla que conceda, se deniega. El
# resultado medido fue 'Denied PUBLISH ... rc135' para el nodo publicando en
# su PROPIO subarbol, y entrega vacia punta a punta. O sea: ningun nodo podia
# mandar telemetria ni recibir su OTA. Fail-closed, no fuga.
# Evidencia previa: verificacion/resultados-actions/acl-enforcement-v2.txt
#
# La sustitucion de %u (usuario) y %c (client-id) ocurre SOLO en lineas
# 'pattern'. Por eso el subarbol por nodo se expresa con 'pattern'.
#
# 'allow_anonymous false' NO va en este archivo: va en mosquitto.conf. El
# bloque 'user anonymous' anterior no denegaba nada (mosquitto no tiene
# 'deny'): CONCEDIA 'read #'/'write #' a quien se autenticara con ese nombre.
# Medido: 'PUBACK rc0' publicando en 'cualquier/cosa'. Era inalcanzable via el
# mqtt_username de Fleet, que siempre contiene '_', asi que parecia una
# defensa y era una concesion muerta. Se elimina.

# Cada cliente autenticado accede SOLO a su propio subarbol.
# %u se expande al username presentado en el CONNECT.
pattern read  fleet/%u/#
pattern write fleet/%u/#

# El Fleet Manager publica OTA y alertas a toda la flota y lee su telemetria.
user fleet_server
topic readwrite fleet/#
